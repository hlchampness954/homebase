<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#161922">
<title>HomeBase</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#0e1018;--bg2:#161922;--bg3:#1e222e;--bg4:#252a38;
  --border:#272d3d;--border2:#333a52;
  --text:#dde1f0;--text2:#8890aa;--text3:#4a5270;
  --teal:#3ecfb8;--teal-d:#2db8a3;--teal-bg:rgba(62,207,184,.09);
  --amber:#f0a500;--amber-bg:rgba(240,165,0,.09);
  --coral:#ff6b6b;--coral-bg:rgba(255,107,107,.09);
  --violet:#9d7ff4;--violet-bg:rgba(157,127,244,.09);
  --sage:#6db87a;--sage-bg:rgba(109,184,122,.09);
  --sky:#5b9bd5;--sky-bg:rgba(91,155,213,.09);
  --r:14px;--rs:9px;--sh:0 8px 32px rgba(0,0,0,.5);
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);height:100dvh;height:100svh;display:flex;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top);}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 50% at 50% -20%,rgba(62,207,184,.04),transparent);pointer-events:none;z-index:0;}
.topnav{position:relative;z-index:20;display:flex;align-items:center;padding:0 16px;height:54px;background:var(--bg2);border-bottom:1px solid var(--border);gap:4px;flex-shrink:0;overflow:hidden;}
.brand{font-family:'Fraunces',serif;font-size:19px;color:var(--teal);letter-spacing:-.5px;margin-right:10px;flex-shrink:0;}
.tab{display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:30px;border:1px solid transparent;background:transparent;color:var(--text2);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all .18s;white-space:nowrap;}
.tab:hover{color:var(--text);background:var(--bg3);}
.tab.active{color:var(--teal);background:var(--teal-bg);border-color:rgba(62,207,184,.25);}
.tab.t-home.active{color:var(--amber);background:var(--amber-bg);border-color:rgba(240,165,0,.25);}
.tab.t-proj.active{color:var(--violet);background:var(--violet-bg);border-color:rgba(157,127,244,.25);}
.tab.t-cal.active{color:var(--sky);background:var(--sky-bg);border-color:rgba(91,155,213,.25);}
.nav-right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-shrink:0;}
.clock{font-size:12px;color:var(--text3);font-weight:500;}
.wall-btn{padding:6px 13px;border-radius:30px;border:1px solid rgba(109,184,122,.3);background:var(--sage-bg);color:var(--sage);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;}
.wall-btn:hover{background:rgba(109,184,122,.18);}
.body{flex:1;overflow:hidden;position:relative;z-index:1;}
.tabpane{display:none;height:100%;flex-direction:column;}
.tabpane.active{display:flex;}
.btn{padding:7px 15px;border-radius:var(--rs);border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;transition:all .15s;}
.btn-teal{background:var(--teal);color:#052a25;}
.btn-teal:hover{background:var(--teal-d);}
.btn-ghost{background:var(--bg3);color:var(--text2);border:1px solid var(--border);}
.btn-ghost:hover{color:var(--text);border-color:var(--border2);}
.btn-violet{background:var(--violet);color:#1a0f40;}
.btn-violet:hover{background:#b49bf7;}
.btn-sm{padding:5px 11px;font-size:11px;}
.btn-xs{padding:3px 8px;font-size:10px;border-radius:6px;}

/* ══ TASKS LAYOUT ══ */
.tasks-layout{display:grid;grid-template-columns:232px 1fr;height:100%;overflow:hidden;}
.tsidebar{background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
.ts-top{padding:14px 13px 11px;border-bottom:1px solid var(--border);flex-shrink:0;}
.ts-top h3{font-family:'Fraunces',serif;font-size:14px;margin-bottom:10px;color:var(--text);}
.qadd{display:flex;gap:6px;}
.qadd input{flex:1;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--rs);padding:7px 10px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:12px;outline:none;}
.qadd input:focus{border-color:var(--teal);}
.qadd input::placeholder{color:var(--text3);}
.qadd button{width:30px;height:30px;border-radius:8px;background:var(--teal);border:none;color:#052a25;font-size:17px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s;}
.qadd button:hover{background:var(--teal-d);}
.tnav{flex:1;overflow-y:auto;padding:8px;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
.tnav::-webkit-scrollbar{width:3px;}
.tnav::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.tnav-sec{margin-bottom:16px;}
.tnav-lbl{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:1px;padding:4px 8px;display:flex;align-items:center;justify-content:space-between;}
.tnav-add-btn{background:none;border:none;color:var(--text3);cursor:pointer;font-size:16px;line-height:1;padding:0 2px;border-radius:4px;transition:color .15s;}
.tnav-add-btn:hover{color:var(--text);}
.tli{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--rs);cursor:pointer;border:none;background:none;width:100%;text-align:left;color:var(--text2);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;transition:all .15s;position:relative;}
.tli:hover{background:var(--bg3);color:var(--text);}
.tli.active{background:var(--teal-bg);color:var(--teal);}
.tli .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.tli .cnt{margin-left:auto;font-size:10px;color:var(--text3);background:var(--bg3);padding:1px 6px;border-radius:8px;}
.tli .df{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text3);cursor:pointer;font-size:11px;opacity:0;transition:opacity .15s;padding:2px 4px;}
.tli:hover .df{opacity:1;}
.tli .df:hover{color:var(--coral);}

/* ══ MAIN TASK AREA with sub-views ══ */
.tmain{display:flex;flex-direction:column;overflow:hidden;flex:1;min-height:0;}
.tmain-hdr{padding:14px 22px 11px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.tmain-title{font-family:'Fraunces',serif;font-size:20px;}
.tmain-tabs{display:flex;gap:4px;}
.mv-tab{padding:5px 13px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text2);font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;}
.mv-tab:hover{color:var(--text);}
.mv-tab.active{background:var(--teal-bg);border-color:rgba(62,207,184,.3);color:var(--teal);}
.mv-tab.sum-tab.active{background:var(--violet-bg);border-color:rgba(157,127,244,.3);color:var(--violet);}
.mv-tab.hist-tab.active{background:var(--amber-bg);border-color:rgba(240,165,0,.3);color:var(--amber);}

/* filter bar */
.filter-bar{padding:9px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-shrink:0;}
.filter-bar select,.filter-bar input{background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:5px 10px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:11px;outline:none;}
.filter-bar select option{background:var(--bg3);}
.filter-lbl{font-size:11px;color:var(--text3);font-weight:600;}

/* task scroll */
.tscroll{flex:1;overflow-y:auto;padding:12px 22px 80px;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
.tscroll::-webkit-scrollbar{width:5px;}
.tscroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}

/* task row */
.trow{display:flex;align-items:flex-start;gap:11px;padding:10px 13px;border-radius:var(--r);border:1px solid transparent;background:var(--bg2);margin-bottom:5px;transition:all .18s;position:relative;overflow:hidden;}
.trow::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px 0 0 3px;}
.trow:hover{border-color:var(--border2);transform:translateX(2px);}
.trow.done{opacity:.45;}
.trow.ph::before{background:var(--coral);}
.trow.pm::before{background:var(--amber);}
.trow.pl::before{background:var(--text3);}
.tcirc{width:19px;height:19px;border-radius:50%;border:2px solid var(--border2);flex-shrink:0;margin-top:1px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;transition:all .18s;}
.tcirc:hover{border-color:var(--teal);}
.tcirc.chk{background:var(--teal);border-color:var(--teal);color:#052a25;font-weight:700;}
.tbody{flex:1;min-width:0;}
.tname{font-size:13px;font-weight:500;color:var(--text);line-height:1.4;}
.trow.done .tname{text-decoration:line-through;color:var(--text3);}
.tchips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;}
.chip{font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px;}
.c-teal{background:var(--teal-bg);color:var(--teal);}
.c-amber{background:var(--amber-bg);color:var(--amber);}
.c-coral{background:var(--coral-bg);color:var(--coral);}
.c-violet{background:var(--violet-bg);color:var(--violet);}
.c-sage{background:var(--sage-bg);color:var(--sage);}
.c-sky{background:var(--sky-bg);color:var(--sky);}
.c-muted{background:var(--bg3);color:var(--text3);}
.tright{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0;}
.tdlbl{font-size:11px;color:var(--text3);}
.tdelbtn{background:none;border:none;color:var(--text3);cursor:pointer;font-size:13px;padding:2px 4px;border-radius:4px;opacity:0;transition:all .15s;}
.trow:hover .tdelbtn{opacity:1;}
.tdelbtn:hover{color:var(--coral);background:var(--coral-bg);}
.empty-st{text-align:center;padding:48px 20px;color:var(--text3);}
.empty-st .ei{font-size:34px;margin-bottom:10px;}
.sec-lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--text3);padding:10px 0 6px;display:flex;align-items:center;gap:8px;}
.sec-lbl::after{content:'';flex:1;height:1px;background:var(--border);}

/* ══ FOLDER DRILL-DOWN VIEW ══ */
.folder-view{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.fv-hdr{padding:14px 22px 11px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-shrink:0;}
.fv-back{background:none;border:none;color:var(--text3);cursor:pointer;font-size:18px;padding:0 4px;transition:color .15s;}
.fv-back:hover{color:var(--text);}
.fv-title{font-family:'Fraunces',serif;font-size:18px;flex:1;}
.fv-body{flex:1;overflow-y:auto;padding:12px 22px 80px;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
.fv-body::-webkit-scrollbar{width:5px;}
.fv-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}

/* prebuilt tasks */
.prebuilt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-bottom:20px;}
.pb-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:11px 13px;cursor:pointer;transition:all .15s;}
.pb-card:hover{border-color:var(--teal);background:var(--teal-bg);}
.pb-name{font-size:12px;font-weight:600;color:var(--text);margin-bottom:3px;}
.pb-freq{font-size:10px;color:var(--text3);}
.pb-add{font-size:10px;font-weight:700;color:var(--teal);margin-top:5px;}

/* ══ HISTORY VIEW ══ */
.hist-filter{padding:10px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0;flex-wrap:wrap;}
.hf-pill{padding:4px 12px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text2);font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;}
.hf-pill:hover{color:var(--text);}
.hf-pill.active{background:var(--amber-bg);border-color:rgba(240,165,0,.3);color:var(--amber);}
.hf-sep{width:1px;height:18px;background:var(--border);}
.hist-scroll{flex:1;overflow-y:auto;padding:12px 22px 80px;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
.hist-scroll::-webkit-scrollbar{width:5px;}
.hist-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
.hist-date-group{margin-bottom:16px;}
.hdg-date{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--text3);margin-bottom:6px;display:flex;align-items:center;gap:8px;}
.hdg-date::after{content:'';flex:1;height:1px;background:var(--border);}

/* ══ SUMMARY VIEW ══ */
.sum-body{flex:1;overflow-y:auto;padding:20px 28px 80px;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
.sum-body::-webkit-scrollbar{width:5px;}
.sum-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
.sum-filter-row{display:flex;gap:6px;margin-bottom:24px;}
.sum-pill{padding:5px 14px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text2);font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;}
.sum-pill:hover{color:var(--text);}
.sum-pill.active{background:var(--violet-bg);border-color:rgba(157,127,244,.3);color:var(--violet);}
.sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px;}
.sum-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px;}
.sum-card.wide{grid-column:1/-1;}
.sum-card-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text3);margin-bottom:14px;}
.sum-big-num{font-family:'Fraunces',serif;font-size:36px;color:var(--text);line-height:1;}
.sum-big-sub{font-size:12px;color:var(--text3);margin-top:4px;}
.sum-change{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px;margin-top:8px;}
.sum-change.up{background:var(--sage-bg);color:var(--sage);}
.sum-change.down{background:var(--coral-bg);color:var(--coral);}
.sum-change.neutral{background:var(--bg3);color:var(--text3);}

/* bar chart */
.chart-wrap{width:100%;overflow-x:auto;}
.chart{display:flex;align-items:flex-end;gap:6px;height:100px;padding:0 4px;}
.bar-group{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;min-width:28px;}
.bar-stack{display:flex;flex-direction:column;justify-content:flex-end;gap:1px;height:90px;width:100%;}
.bar-seg{border-radius:3px 3px 0 0;min-height:2px;transition:height .4s ease;}
.bar-lbl{font-size:9px;color:var(--text3);text-align:center;white-space:nowrap;}
.chart-legend{display:flex;gap:14px;margin-top:8px;}
.leg-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2);}
.leg-dot{width:8px;height:8px;border-radius:2px;}

/* highlights */
.highlight-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);}
.highlight-row:last-child{border-bottom:none;}
.hl-icon{font-size:22px;width:36px;text-align:center;flex-shrink:0;}
.hl-body{flex:1;}
.hl-label{font-size:13px;font-weight:600;color:var(--text);}
.hl-sub{font-size:11px;color:var(--text3);margin-top:2px;}
.hl-val{font-family:'Fraunces',serif;font-size:20px;color:var(--teal);flex-shrink:0;}

/* top types */
.tt-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);}
.tt-row:last-child{border-bottom:none;}
.tt-bar-wrap{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden;}
.tt-bar{height:100%;border-radius:3px;background:var(--violet);}
.tt-name{font-size:12px;color:var(--text);min-width:100px;}
.tt-cnt{font-size:11px;color:var(--text3);min-width:28px;text-align:right;}

/* ══ HOME MANAGER ══ */
.home-layout{display:grid;grid-template-columns:1fr 1fr 1fr;height:100%;overflow:hidden;}
.hpanel{border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
.hpanel:last-child{border-right:none;}
.hpanel-hdr{padding:13px 16px 11px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.hpanel-title{font-family:'Fraunces',serif;font-size:14px;display:flex;align-items:center;gap:7px;}
.hplus{background:none;border:none;color:var(--text3);cursor:pointer;font-size:20px;line-height:1;padding:0 3px;border-radius:4px;transition:all .15s;}
.hplus:hover{color:var(--text);background:var(--bg3);}
.hscroll{flex:1;overflow-y:auto;padding:10px 14px;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
.hscroll::-webkit-scrollbar{width:3px;}
.hscroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.mrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);}
.mrow:last-child{border-bottom:none;}
.micn{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
.mbody{flex:1;min-width:0;}
.mname{font-size:13px;font-weight:600;color:var(--text);}
.mfreq{font-size:11px;color:var(--text3);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mright{text-align:right;flex-shrink:0;}
.mdue{font-size:11px;color:var(--text2);}
.spill{display:inline-block;font-size:10px;font-weight:700;padding:2px 6px;border-radius:8px;margin-top:2px;}
.s-over{background:var(--coral-bg);color:var(--coral);}
.s-soon{background:var(--amber-bg);color:var(--amber);}
.s-ok{background:var(--sage-bg);color:var(--sage);}
.erow{background:var(--bg3);border-radius:var(--rs);padding:9px 11px;display:flex;align-items:center;gap:9px;border:1px solid var(--border);cursor:pointer;transition:all .15s;margin-bottom:6px;}
.erow:hover{border-color:var(--border2);}
.einfo{flex:1;min-width:0;}
.ename{font-size:13px;font-weight:600;}
.emodel{font-size:11px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ncard{background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);padding:10px 12px;margin-bottom:6px;cursor:pointer;transition:all .15s;}
.ncard:hover{border-color:var(--border2);}
.ntitle{font-size:13px;font-weight:600;margin-bottom:3px;}
.nbody{font-size:12px;color:var(--text2);line-height:1.5;}

/* ══ PROJECTS ══ */
.proj-layout{display:grid;grid-template-columns:280px 1fr;height:100%;overflow:hidden;}
.proj-sidebar{background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
.proj-sidebar-top{padding:14px 14px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.proj-sidebar-top h3{font-family:'Fraunces',serif;font-size:14px;}
.plist{flex:1;overflow-y:auto;padding:10px;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
.plist::-webkit-scrollbar{width:3px;}
.plist::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.pitem{padding:11px 12px;border-radius:var(--rs);border:1px solid var(--border);background:var(--bg3);margin-bottom:7px;cursor:pointer;transition:all .15s;}
.pitem:hover{border-color:var(--border2);}
.pitem.active{border-color:rgba(157,127,244,.4);background:var(--violet-bg);}
.pi-name{font-size:13px;font-weight:600;color:var(--text);margin-bottom:5px;}
.pi-bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin-bottom:4px;}
.pi-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--violet),var(--teal));}
.pi-meta{font-size:11px;color:var(--text3);display:flex;justify-content:space-between;}
.proj-detail{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.pdh{padding:16px 22px 12px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;flex-shrink:0;}
.pdh-title{font-family:'Fraunces',serif;font-size:22px;}
.pdh-sub{font-size:12px;color:var(--text3);margin-top:3px;}
.pd-body{flex:1;overflow-y:auto;padding:18px 22px 80px;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
.pd-body::-webkit-scrollbar{width:5px;}
.pd-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
.proj-empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--text3);flex-direction:column;gap:12px;}
.pd-sec{margin-bottom:24px;}
.pd-sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.pd-sec-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text3);}
.pd-add-btn{background:none;border:none;color:var(--text3);cursor:pointer;font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;transition:all .15s;}
.pd-add-btn:hover{color:var(--violet);background:var(--violet-bg);}
.bom-table{width:100%;border-collapse:collapse;}
.bom-table th{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--text3);padding:6px 10px;text-align:left;border-bottom:1px solid var(--border);}
.bom-table td{padding:9px 10px;font-size:13px;border-bottom:1px solid var(--border);color:var(--text2);}
.bom-table tr:last-child td{border-bottom:none;}
.bom-table td:first-child{color:var(--text);}
.bom-proj{color:var(--amber)!important;}
.bom-actual{color:var(--sage)!important;}
.bom-total{font-weight:700;background:var(--bg3);}
.bom-del{background:none;border:none;color:var(--text3);cursor:pointer;font-size:12px;padding:2px 4px;border-radius:4px;opacity:0;transition:all .15s;}
.bom-table tr:hover .bom-del{opacity:1;}
.bom-del:hover{color:var(--coral);}
.step-row{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);}
.step-row:last-child{border-bottom:none;}
.step-circ{width:20px;height:20px;border-radius:50%;border:2px solid var(--border2);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;transition:all .18s;margin-top:1px;}
.step-circ:hover{border-color:var(--violet);}
.step-circ.done{background:var(--violet);border-color:var(--violet);color:#1a0f40;font-weight:700;}
.step-body{flex:1;}
.step-name{font-size:13px;color:var(--text);}
.step-row.done .step-name{text-decoration:line-through;color:var(--text3);}
.step-note{font-size:11px;color:var(--text3);margin-top:2px;}
.step-del{background:none;border:none;color:var(--text3);cursor:pointer;font-size:12px;padding:2px 4px;border-radius:4px;opacity:0;transition:all .15s;}
.step-row:hover .step-del{opacity:1;}
.step-del:hover{color:var(--coral);}
.proj-note-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);padding:12px 14px;margin-bottom:8px;}
.proj-note-card a{color:var(--sky);font-size:12px;}

/* ══ CALENDAR ══ */
.cal-layout{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.cal-toolbar{padding:12px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0;}
.cal-nav-title{font-family:'Fraunces',serif;font-size:18px;min-width:200px;}
.cal-view-btns{display:flex;gap:4px;margin-left:auto;}
.cvb{padding:5px 13px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text2);font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;}
.cvb:hover{color:var(--text);background:var(--bg3);}
.cvb.active{background:var(--sky-bg);border-color:rgba(91,155,213,.3);color:var(--sky);}
.cal-body{flex:1;overflow:hidden;display:flex;flex-direction:column;}
.cal-month{flex:1;overflow:hidden;display:flex;flex-direction:column;padding:12px 16px;}
.cal-daynames{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:5px;}
.cal-dn{text-align:center;font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;padding:3px 0;}
.cal-grid-m{display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(6,1fr);gap:5px;flex:1;}
.cal-cell{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:7px 8px;display:flex;flex-direction:column;overflow:hidden;cursor:pointer;transition:all .15s;}
.cal-cell:hover{border-color:var(--border2);background:var(--bg3);}
.cal-cell.today{border-color:var(--teal);background:var(--teal-bg);}
.cal-cell.other{opacity:.3;}
.ccnum{font-size:11px;font-weight:600;color:var(--text2);margin-bottom:3px;}
.cal-cell.today .ccnum{color:var(--teal);}
.cev{font-size:9px;padding:1px 5px;border-radius:3px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;}
.cal-week{flex:1;overflow:hidden;display:flex;flex-direction:column;}
.week-header{display:grid;grid-template-columns:56px repeat(7,1fr);border-bottom:1px solid var(--border);flex-shrink:0;}
.week-day-hdr{padding:10px 8px;text-align:center;border-left:1px solid var(--border);cursor:pointer;}
.week-day-hdr:hover{background:var(--bg3);}
.wdname{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;}
.wdnum{font-size:16px;font-weight:600;color:var(--text2);margin-top:2px;}
.week-day-hdr.today .wdnum{color:var(--teal);}
.week-body{flex:1;overflow-y:auto;display:grid;grid-template-columns:56px repeat(7,1fr);}
.week-body::-webkit-scrollbar{width:4px;}
.week-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.time-col{border-right:1px solid var(--border);}
.time-slot{height:48px;display:flex;align-items:flex-start;padding:2px 6px;font-size:10px;color:var(--text3);border-bottom:1px solid var(--border);flex-shrink:0;}
.week-col{border-left:1px solid var(--border);cursor:pointer;}
.week-col:hover{background:rgba(255,255,255,.01);}
.week-cell{height:48px;border-bottom:1px solid var(--border);position:relative;padding:2px;}
.week-event{border-radius:4px;padding:1px 5px;font-size:10px;font-weight:600;overflow:hidden;cursor:pointer;margin-bottom:1px;white-space:nowrap;text-overflow:ellipsis;}
.cal-day-view{flex:1;overflow:hidden;display:flex;flex-direction:column;}
.day-view-body{flex:1;overflow-y:auto;display:grid;grid-template-columns:60px 1fr;}
.day-view-body::-webkit-scrollbar{width:4px;}
.day-view-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.dv-time{height:52px;display:flex;align-items:flex-start;padding-top:3px;font-size:11px;color:var(--text3);border-right:1px solid var(--border);padding-right:10px;}
.dv-slot{height:52px;border-bottom:1px solid var(--border);padding:3px 10px;cursor:pointer;}
.dv-slot:hover{background:rgba(255,255,255,.01);}
.dv-event{border-radius:6px;padding:3px 8px;font-size:11px;font-weight:600;margin-bottom:3px;}
.dv-task-item{background:var(--teal-bg);border:1px solid rgba(62,207,184,.2);color:var(--teal);border-radius:6px;padding:3px 8px;font-size:11px;font-weight:600;margin-bottom:3px;}

/* ══ DAY POPUP ══ */
.day-popup{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);z-index:300;display:none;align-items:center;justify-content:center;}
.day-popup.open{display:flex;}
.dp-inner{background:var(--bg2);border:1px solid var(--border2);border-radius:20px;width:500px;max-height:80dvh;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--sh);animation:popIn .2s ease;}
@keyframes popIn{from{opacity:0;transform:scale(.95) translateY(10px);}to{opacity:1;transform:scale(1) translateY(0);}}
.dp-hdr{padding:18px 20px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.dp-title{font-family:'Fraunces',serif;font-size:18px;}
.dp-close{background:none;border:none;color:var(--text3);cursor:pointer;font-size:20px;padding:0 4px;border-radius:4px;transition:color .15s;}
.dp-close:hover{color:var(--text);}
.dp-body{flex:1;overflow-y:auto;padding:16px 20px;}
.dp-sec{margin-bottom:18px;}
.dp-sec-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text3);margin-bottom:8px;}
.dp-item{background:var(--bg3);border-radius:var(--rs);padding:9px 12px;margin-bottom:5px;font-size:13px;color:var(--text);}
.dp-item-sub{font-size:11px;color:var(--text3);margin-top:2px;}

/* ══ AI BUBBLE ══ */
.ai-backdrop{display:none;}
.ai-fab{position:fixed;bottom:24px;right:24px;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--violet),#6d28d9);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 4px 20px rgba(157,127,244,.45);z-index:400;transition:all .2s;}
.ai-fab:hover{transform:scale(1.08);}
.ai-fab-ring{position:absolute;inset:-4px;border-radius:50%;border:2px solid rgba(157,127,244,.3);animation:ring 2.5s infinite;}
@keyframes ring{0%,100%{transform:scale(1);opacity:.5;}50%{transform:scale(1.15);opacity:0;}}
/* ai-win replaced by ai-fullscreen */
/* ai-win.open replaced */
.ai-winhdr{padding:14px 16px 10px;border-bottom:1px solid var(--border);flex-shrink:0;display:flex;align-items:flex-start;justify-content:space-between;}
.ai-wintitle{font-family:'Fraunces',serif;font-size:15px;color:var(--violet);display:flex;align-items:center;gap:7px;}
.ai-winsub{font-size:11px;color:var(--text3);margin-top:2px;}
.ai-xcls{background:none;border:none;color:var(--text3);cursor:pointer;font-size:18px;padding:0 3px;border-radius:4px;transition:color .15s;line-height:1;}
.ai-xcls:hover{color:var(--text);}
.ai-msgs{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:9px;min-height:160px;max-height:300px;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
.ai-msgs::-webkit-scrollbar{width:3px;}
.ai-msgs::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
.amsg{display:flex;flex-direction:column;gap:2px;animation:msgIn .18s ease;}
@keyframes msgIn{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.amsg-bub{padding:8px 12px;border-radius:12px;font-size:12px;line-height:1.55;}
.amsg.user{align-items:flex-end;}
.amsg.user .amsg-bub{background:var(--teal-bg);border:1px solid rgba(62,207,184,.2);border-bottom-right-radius:3px;}
.amsg.ai{align-items:flex-start;}
.amsg.ai .amsg-bub{background:var(--bg3);border:1px solid var(--border);border-bottom-left-radius:3px;}
.amsg-lbl{font-size:9px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:0 3px;}
.ai-action-card{margin-top:7px;background:var(--bg);border:1px solid var(--border2);border-radius:var(--rs);padding:8px 11px;}
.aac-title{font-size:10px;font-weight:700;color:var(--teal);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;}
.aac-item{display:flex;align-items:center;gap:7px;padding:3px 0;font-size:12px;color:var(--text2);border-bottom:1px solid var(--border);}
.aac-item:last-child{border-bottom:none;}
.aac-ck{color:var(--sage);font-size:10px;}
.ai-chips{padding:7px 12px;display:flex;flex-wrap:wrap;gap:5px;border-top:1px solid var(--border);flex-shrink:0;}
.schip{padding:4px 10px;border-radius:20px;border:1px solid var(--border2);background:transparent;color:var(--text3);font-family:'DM Sans',sans-serif;font-size:10px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap;}
.schip:hover{border-color:var(--violet);color:var(--violet);background:var(--violet-bg);}
.ai-inprow{padding:9px 12px;border-top:1px solid var(--border);display:flex;gap:6px;align-items:flex-end;flex-shrink:0;}
.ai-ta{flex:1;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--rs);padding:8px 10px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:12px;resize:none;outline:none;min-height:36px;max-height:80px;transition:border-color .15s;}
.ai-ta:focus{border-color:var(--violet);}
.ai-ta::placeholder{color:var(--text3);}
.ai-sndbtn{width:34px;height:34px;border-radius:8px;background:var(--violet);border:none;color:#1a0f40;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0;}
.ai-sndbtn:hover{background:#b49bf7;}
.ai-sndbtn:disabled{opacity:.35;cursor:not-allowed;}

/* ══ WALL ══ */
.wall{display:none;position:fixed;inset:0;background:var(--bg);z-index:500;flex-direction:column;padding:24px 28px;}
.wall.open{display:flex;}
.wall-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;}
.wtime{font-family:'Fraunces',serif;font-size:54px;color:var(--text);line-height:1;}
.wdate{font-size:14px;color:var(--text3);margin-top:3px;}
.wall-close{background:var(--bg3);border:1px solid var(--border);border-radius:9px;padding:7px 13px;color:var(--text2);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer;}
.wall-cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;flex:1;overflow:hidden;}
.wcol{background:var(--bg2);border:1px solid var(--border);border-radius:16px;display:flex;flex-direction:column;overflow:hidden;}
.wcol-hdr{padding:14px 18px 10px;border-bottom:1px solid var(--border);flex-shrink:0;}
.wcol-title{font-family:'Fraunces',serif;font-size:15px;}
.wcol-sub{font-size:11px;color:var(--text3);margin-top:2px;}
.wcol-body{flex:1;overflow-y:auto;padding:12px 16px;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
.witem{display:flex;align-items:flex-start;gap:9px;padding:9px 0;border-bottom:1px solid var(--border);}
.witem:last-child{border-bottom:none;}
.wdot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:5px;}
.witem-name{font-size:13px;color:var(--text);line-height:1.4;}
.witem-meta{font-size:11px;color:var(--text3);margin-top:2px;}
.wmaint{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--border);}
.wmaint:last-child{border-bottom:none;}

/* ══ MODALS ══ */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(5px);z-index:600;align-items:center;justify-content:center;}
.overlay.open{display:flex;}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:18px;padding:26px;width:500px;max-width:96vw;max-height:90dvh;overflow-y:auto;box-shadow:var(--sh);animation:popIn .2s ease;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
.modal h3{font-family:'Fraunces',serif;font-size:20px;margin-bottom:18px;}
.fg{margin-bottom:12px;}
.fg label{display:block;font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px;}
.fg input,.fg select,.fg textarea{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--rs);padding:8px 11px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;outline:none;transition:border-color .15s;}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--teal);}
.fg select option{background:var(--bg3);}
.fg textarea{resize:vertical;min-height:65px;}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.macts{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(30px);background:var(--bg3);border:1px solid var(--border2);border-radius:var(--rs);padding:9px 16px;font-size:12px;color:var(--text);z-index:700;box-shadow:var(--sh);opacity:0;transition:all .22s;white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}

/* ══ USER CHIPS ══ */
.user-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;background:var(--bg);border:1px solid var(--border2);font-size:12px;color:var(--text2);}
.user-chip .ux{cursor:pointer;color:var(--text3);font-size:13px;margin-left:2px;}
.user-chip .ux:hover{color:var(--coral);}

/* ══ SUPABASE SYNC STATUS ══ */
.sync-pill{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text3);font-weight:500;padding:4px 10px;border-radius:20px;background:var(--bg3);border:1px solid var(--border);cursor:pointer;transition:all .15s;}
.sync-pill:hover{border-color:var(--border2);}
.sdot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.sdot.ok{background:var(--sage);box-shadow:0 0 5px var(--sage);}
.sdot.off{background:var(--text3);}
.sdot.syn{background:var(--amber);animation:sdotpulse 1s infinite;}
.sdot.err{background:var(--coral);}
@keyframes sdotpulse{0%,100%{opacity:1;}50%{opacity:.3;}}

/* ══ SUPABASE SETUP MODAL ══ */
.sb-setup{width:560px;}
.sb-steps{counter-reset:step;margin-bottom:8px;}
.sb-step{counter-increment:step;display:flex;gap:12px;margin-bottom:12px;padding:14px;background:var(--bg3);border-radius:var(--rs);border:1px solid var(--border);}
.sb-step::before{content:counter(step);width:24px;height:24px;border-radius:50%;background:var(--violet-bg);color:var(--violet);font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid rgba(157,127,244,.3);}
.sb-step-body{flex:1;}
.sb-step-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:4px;}
.sb-step-desc{font-size:12px;color:var(--text2);line-height:1.6;}
.sb-step-desc a{color:var(--violet);}
.sql-block{background:var(--bg);border:1px solid var(--border2);border-radius:var(--rs);padding:11px 13px;margin-top:8px;font-family:monospace;font-size:10px;color:var(--teal);line-height:1.8;overflow-x:auto;white-space:pre;}
.copy-btn{background:var(--bg3);border:1px solid var(--border2);border-radius:6px;padding:4px 10px;font-family:'DM Sans',sans-serif;font-size:10px;color:var(--text2);cursor:pointer;margin-top:5px;transition:all .15s;}
.copy-btn:hover{color:var(--text);border-color:var(--border2);}

/* ══ RESPONSIVE — TABLET (768–1024px) ══ */
@media (max-width:1024px){
  .tasks-layout{grid-template-columns:200px 1fr;}
  .home-layout{grid-template-columns:1fr 1fr;}
  .hpanel:last-child{display:none;}/* notes hidden on tablet, accessible via Home tab scroll */
  .proj-layout{grid-template-columns:220px 1fr;}
  .wall-cols{grid-template-columns:1fr 1fr;}
  /* ai fullscreen — no width needed */
}

/* ══ RESPONSIVE — MOBILE (≤767px) ══ */
@media (max-width:767px){
  /* Hide desktop top nav tabs, show compact header */
  .topnav{padding:0 14px;height:50px;}
  .tab{display:none;}
  .nav-right{gap:6px;}
  .wall-btn{display:none;}
  .clock{font-size:11px;}
  .sync-pill span:last-child{display:none;}/* hide text, keep dot */

  /* Body accounts for bottom nav */
  body{padding-bottom:0;}
  .body{padding-bottom:calc(60px + env(safe-area-inset-bottom));}

  /* Bottom tab bar */
  .bottom-nav{display:flex!important;}

  /* Tasks: hide sidebar, go full width */
  .tasks-layout{grid-template-columns:1fr;}
  .tsidebar{display:none !important;}
  .tsidebar{display:none;}
  .tsidebar.mob-open{display:flex;position:fixed;inset:0;z-index:200;width:80vw;max-width:320px;border-right:1px solid var(--border2);box-shadow:var(--sh);}
  /* mob-sidebar-backdrop shown only via JS when sidebar opens */

  /* Mobile task header gets hamburger */
  .mob-menu-btn{display:flex!important;}

  /* Home manager: single column scroll */
  .home-layout{grid-template-columns:1fr;grid-template-rows:auto;}
  .hpanel{border-right:none;border-bottom:1px solid var(--border);min-height:280px;}
  .hpanel:last-child{border-bottom:none;}

  /* Projects: hide sidebar, use list overlay */
  .proj-layout{grid-template-columns:1fr;}
  .proj-sidebar{display:none;}
  .proj-sidebar.mob-open{display:flex;position:fixed;inset:0;z-index:200;width:85vw;max-width:340px;box-shadow:var(--sh);}
  .proj-mob-header{display:flex!important;}

  /* Calendar: simplify toolbar */
  .cal-toolbar{padding:8px 14px;flex-wrap:wrap;gap:6px;}
  .cal-nav-title{font-size:15px;min-width:0;}
  .cal-view-btns{width:100%;justify-content:center;}
  .cal-month{padding:8px;}
  .cal-grid-m{gap:3px;}
  .cal-cell{padding:4px 5px;border-radius:7px;}
  .ccnum{font-size:10px;}
  .cev{font-size:8px;}

  /* AI window full-width on mobile */
  .ai-fab{display:none;}
  /* ai-win replaced by ai-fullscreen */
  

  /* Modals full screen on mobile */
  .modal{width:100%!important;max-width:100%!important;border-radius:20px 20px 0 0;margin-top:auto;max-height:90dvh;}
  .overlay{align-items:flex-end!important;}

  /* Wall display */
  .wall{padding:16px;}
  .wall-cols{grid-template-columns:1fr;gap:10px;}
  .wtime{font-size:40px;}

  /* Day popup */
  .dp-inner{width:100%!important;max-width:100%!important;border-radius:20px 20px 0 0;margin-top:auto;}

}

/* ══ BOTTOM NAV (mobile only) ══ */
.bottom-nav{

  background:var(--bg2);
  border-top:1px solid var(--border);

  align-items:center;

.bnav-item{
  display:flex;flex-direction:column;align-items:center;gap:3px;

/* Mobile-only elements (hidden on desktop) */

/* ══ PIN LOCK SCREEN ══ */
.pin-screen{
  position:fixed;inset:0;z-index:9999;
  background:var(--bg);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  transition:opacity .3s;
  overflow:hidden;
}
.pin-screen.hidden{opacity:0;pointer-events:none;visibility:hidden;}
.pin-brand{font-family:'Fraunces',serif;font-size:26px;color:var(--teal);margin-bottom:4px;letter-spacing:-.5px;}
.pin-sub{font-size:13px;color:var(--text3);margin-bottom:28px;text-align:center;padding:0 20px;}
.pin-dots{display:flex;gap:18px;margin-bottom:28px;}
.pin-dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--border2);transition:all .15s;background:transparent;}
.pin-dot.filled{background:var(--teal);border-color:var(--teal);transform:scale(1.15);}
.pin-dot.error{background:var(--coral);border-color:var(--coral);animation:shake .35s ease;}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:min(320px,88vw);}
.pin-key{
  height:min(80px,20vw);
  min-height:70px;
  border-radius:18px;
  border:1px solid var(--border2);
  background:var(--bg2);
  color:var(--text);
  font-family:'DM Sans',sans-serif;
  font-size:clamp(22px,6vw,30px);
  font-weight:600;
  cursor:pointer;
  transition:background .1s,transform .1s,border-color .1s;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
  gap:2px;
}
.pin-key:active{background:var(--teal-bg);transform:scale(.92);border-color:var(--teal);}
.pin-key .pk-sub{font-size:9px;font-weight:500;color:var(--text3);letter-spacing:.5px;text-transform:uppercase;line-height:1;}
.pin-key.del{font-size:clamp(18px,5vw,24px);color:var(--text3);}
.pin-key.empty{background:transparent;border:none;cursor:default;}
.pin-err{font-size:13px;color:var(--coral);margin-top:14px;min-height:20px;text-align:center;font-weight:600;}
.pin-hint{font-size:11px;color:var(--text3);margin-top:16px;cursor:pointer;text-decoration:underline;}

/* ══ AI SETUP MODAL ══ */
.ai-setup-modal{width:480px;}
.ai-setup-step{background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);padding:14px;margin-bottom:10px;}
.ai-setup-step-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:6px;}
.ai-setup-step-desc{font-size:12px;color:var(--text2);line-height:1.7;}
.ai-setup-step-desc a{color:var(--violet);}
.ai-key-input{width:100%;background:var(--bg);border:1px solid var(--border2);border-radius:var(--rs);padding:9px 12px;color:var(--text);font-family:monospace;font-size:11px;outline:none;margin-top:8px;transition:border-color .15s;}
.ai-key-input:focus{border-color:var(--violet);}

/* ══ MOBILE TASK HOME ══ */
.task-home{flex:1;overflow-y:auto;padding-bottom:calc(80px + env(safe-area-inset-bottom));scrollbar-width:none;}
.task-home::-webkit-scrollbar{display:none;}
.th-section{margin-bottom:6px;}
.th-section-hdr{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 8px;}

.th-add-btn{width:28px;height:28px;border-radius:50%;background:var(--teal);border:none;color:#052a25;font-size:18px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .1s;-webkit-tap-highlight-color:transparent;}

.th-row-badge{background:var(--teal);border-radius:12px;padding:2px 9px;font-size:12px;font-weight:700;color:#052a25;margin-right:8px;flex-shrink:0;}
.th-row-arrow{color:var(--text3);font-size:20px;line-height:1;flex-shrink:0;}

/* ══ SUBFOLDER (sf) VIEW ══ */
.sf-hdr{padding:10px 14px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0;}
.sf-back{width:36px;height:36px;border-radius:50%;background:var(--bg3);border:none;color:var(--text);cursor:pointer;font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;flex-shrink:0;}
.sf-back:active{background:var(--border2);}
.sf-hdr-title{font-family:'Fraunces',serif;font-size:18px;flex:1;}
.sf-meta{padding:8px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}

.sf-filter-btn{display:flex;align-items:center;gap:5px;padding:6px 13px;border-radius:20px;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent;}

.sf-scroll{flex:1;overflow-y:auto;padding:10px 14px calc(90px + env(safe-area-inset-bottom));scrollbar-width:none;}
.sf-scroll::-webkit-scrollbar{display:none;}

/* ══ TASK FAB ══ */
.task-fab{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom));right:20px;width:56px;height:56px;border-radius:50%;background:var(--teal);border:none;color:#052a25;font-size:32px;font-weight:300;line-height:1;cursor:pointer;display:none;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(62,207,184,.5);z-index:160;-webkit-tap-highlight-color:transparent;}

/* ══ FILTER SHEET ══ */
.flt-sheet{position:fixed;inset:0;z-index:500;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .22s;}

.flt-hdr{padding:14px 18px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);}

.flt-close{background:none;border:none;color:var(--text3);font-size:20px;cursor:pointer;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%;}

.fopt.active{background:var(--teal-bg);border-color:rgba(62,207,184,.4);color:var(--teal);}
.flt-apply{margin:14px 18px 8px;padding:14px;width:calc(100% - 36px);border-radius:14px;background:var(--teal);border:none;color:#052a25;font-family:'DM Sans',sans-serif;font-size:16px;font-weight:700;cursor:pointer;display:block;}

/* ══ ADD TASK SHEET ══ */
.tns-sheet{position:fixed;inset:0;z-index:600;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .22s;}

.tns-preset-btn{background:none;border:none;border-left:1.5px solid var(--border2);padding:0 13px;color:var(--teal);font-family:'DM Sans',sans-serif;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0;-webkit-tap-highlight-color:transparent;}

.tns-notes::placeholder{color:var(--text3);}
.tns-rows{margin:10px 16px 0;background:var(--bg3);border:1px solid var(--border2);border-radius:14px;overflow:hidden;}
.tns-row{display:flex;align-items:center;padding:14px;border-bottom:1px solid var(--border);cursor:pointer;-webkit-tap-highlight-color:transparent;min-height:52px;gap:12px;position:relative;}
.tns-row:last-child{border-bottom:none;}
.tns-row:active{background:var(--bg4);}
.tns-row-icon{font-size:16px;width:24px;text-align:center;flex-shrink:0;}
.tns-row-label{font-size:14px;font-weight:600;color:var(--text2);flex:1;}
.tns-row-value{font-size:14px;color:var(--text);max-width:55%;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tns-row-arrow{color:var(--text3);font-size:18px;margin-left:6px;flex-shrink:0;line-height:1;}
.tns-toggle{position:relative;width:44px;height:26px;flex-shrink:0;}
.tns-toggle input{opacity:0;width:0;height:0;position:absolute;}
.tns-toggle-slider{position:absolute;inset:0;background:var(--border2);border-radius:13px;transition:background .2s;cursor:pointer;}
.tns-toggle-slider:before{content:'';position:absolute;width:20px;height:20px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:transform .2s;box-shadow:0 1px 4px rgba(0,0,0,.3);}
.tns-toggle input:checked+.tns-toggle-slider{background:var(--teal);}
.tns-toggle input:checked+.tns-toggle-slider:before{transform:translateX(18px);}
.tns-save-btn{margin:14px 16px 12px;padding:16px;width:calc(100% - 32px);border-radius:14px;background:var(--teal);border:none;color:#052a25;font-family:'DM Sans',sans-serif;font-size:16px;font-weight:700;cursor:pointer;display:block;-webkit-tap-highlight-color:transparent;}

.tsk-chk-name{font-size:14px;font-weight:600;color:var(--text);flex:1;}
.tsk-chk-freq{font-size:11px;color:var(--text3);background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:2px 7px;white-space:nowrap;flex-shrink:0;}
.tsk-chk-exp{display:none;padding:2px 14px 12px;border-top:1px solid var(--border);}
.tsk-chk-item.expanded .tsk-chk-exp{display:block;}
.tsk-exp-row{display:flex;align-items:center;gap:10px;margin-top:10px;}
.tsk-exp-lbl{font-size:12px;color:var(--text3);width:54px;flex-shrink:0;}
.tsk-exp-inp{flex:1;background:var(--bg);border:1px solid var(--border2);border-radius:8px;padding:7px 10px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;outline:none;}
.tsk-exp-inp:focus{border-color:var(--teal);}
.task-sel-footer{padding:12px 16px;border-top:1px solid var(--border);flex-shrink:0;}
.task-sel-save{width:100%;padding:15px;border-radius:14px;background:var(--teal);border:none;color:#052a25;font-family:'DM Sans',sans-serif;font-size:16px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .15s;}
.task-sel-save:disabled{opacity:.45;cursor:default;}
.task-sel-save:not(:disabled):active{background:var(--teal-d);}

/* ══ SUGGESTED TASKS SHEET ══ */
.sugg-sheet{
  position:fixed;inset:0;z-index:300;
  display:flex;flex-direction:column;
  justify-content:flex-end;
  background:rgba(0,0,0,.55);
  backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;
  transition:opacity .25s;
}
.sugg-sheet.open{opacity:1;pointer-events:all;}
.sugg-inner{
  background:var(--bg2);
  border-radius:22px 22px 0 0;
  border:1px solid var(--border2);
  border-bottom:none;
  max-height:82dvh;
  display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom);
  transform:translateY(100%);
  transition:transform .3s cubic-bezier(.32,1.1,.6,1);
}
.sugg-sheet.open .sugg-inner{transform:translateY(0);}
.sugg-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:10px auto 0;flex-shrink:0;}
.sugg-header{padding:14px 18px 10px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;border-bottom:1px solid var(--border);}
.sugg-title{font-family:'Fraunces',serif;font-size:17px;color:var(--text);}
.sugg-close{background:none;border:none;color:var(--text3);font-size:20px;cursor:pointer;padding:2px 6px;border-radius:6px;}
.sugg-close:hover{color:var(--text);}
.sugg-scroll{flex:1;overflow-y:auto;padding:12px 14px 20px;display:flex;flex-direction:column;gap:8px;scrollbar-width:thin;}
.sugg-card{
  background:var(--bg3);border:1px solid var(--border);
  border-radius:14px;padding:12px 14px;
  display:flex;flex-direction:column;gap:8px;
}
.sugg-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.sugg-card-name{font-size:14px;font-weight:600;color:var(--text);flex:1;cursor:text;outline:none;border:none;background:transparent;font-family:'DM Sans',sans-serif;padding:0;}
.sugg-card-name:focus{color:var(--teal);}
.sugg-card-freq{font-size:11px;color:var(--text3);background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:2px 8px;cursor:pointer;white-space:nowrap;flex-shrink:0;}
.sugg-card-bottom{display:flex;gap:8px;align-items:center;}
.sugg-card-who{font-size:11px;padding:3px 8px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text2);font-family:'DM Sans',sans-serif;cursor:pointer;}
.sugg-card-add{margin-left:auto;padding:5px 14px;border-radius:8px;border:none;background:var(--teal);color:#052a25;font-size:12px;font-weight:700;cursor:pointer;transition:background .15s;font-family:'DM Sans',sans-serif;}
.sugg-card-add:hover{background:var(--teal-d);}
.sugg-folder-badge{font-size:11px;color:var(--text3);margin-bottom:4px;}


/* ══ iOS APP — FULL REDESIGN ══ */

/* ── Task Home Screen ── */
.task-home{
  padding:16px 14px calc(90px + env(safe-area-inset-bottom));
  overflow-y:auto;height:100%;
  -webkit-overflow-scrolling:touch;
}
.th-section{margin-bottom:24px;}
.th-section-hdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 4px 8px;
}
.th-section-title{
  font-size:12px;font-weight:700;
  color:var(--text3);text-transform:uppercase;letter-spacing:.7px;
}
.th-add-btn{
  background:none;border:none;
  color:var(--teal);font-size:24px;line-height:1;
  cursor:pointer;padding:0 4px;
  -webkit-tap-highlight-color:transparent;
}
.th-section-card{
  background:var(--bg2);border-radius:14px;
  overflow:hidden;border:1px solid var(--border);
}
.th-row{
  display:flex;align-items:center;gap:12px;
  padding:13px 14px;
  cursor:pointer;position:relative;
  -webkit-tap-highlight-color:transparent;
  transition:background .1s;
}
.th-row:active{background:rgba(255,255,255,.04);}
.th-row:not(:last-child)::after{
  content:'';position:absolute;
  bottom:0;left:50px;right:0;
  height:.5px;background:var(--border);
}
.th-row-icon{
  font-size:20px;width:34px;height:34px;
  display:flex;align-items:center;justify-content:center;
  border-radius:9px;background:var(--bg3);flex-shrink:0;
}
.th-row-body{flex:1;min-width:0;}
.th-row-name{font-size:15px;font-weight:600;color:var(--text);}
.th-row-sub{font-size:12px;color:var(--text3);margin-top:2px;}
.th-row-sub.overdue-sub{color:var(--coral);}
.th-row-badge{
  background:var(--teal);color:#052a25;
  font-size:11px;font-weight:800;
  min-width:22px;height:20px;
  padding:0 6px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
}
.th-row-badge.badge-over{background:var(--coral);color:#fff;}
.th-row-arrow{color:var(--border2);font-size:13px;}
.th-empty-row{
  padding:16px 14px;
  font-size:13px;color:var(--text3);text-align:center;
}

/* Progress ring */
svg.ring{overflow:visible;flex-shrink:0;}
circle.ring-bg{fill:none;stroke:var(--border2);stroke-width:2.5;}
circle.ring-fg{fill:none;stroke:var(--teal);stroke-width:2.5;stroke-linecap:round;}

.trow{

  position:relative;
  -webkit-tap-highlight-color:transparent;
  transition:background .1s;

.trow:active{background:var(--bg3);}

}

/* ── Section labels ── */
.sec-lbl{
  font-size:12px;font-weight:700;color:var(--text3);
