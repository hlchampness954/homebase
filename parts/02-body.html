<body>

<!-- ═══ AUTH / SETUP ═══ -->
<div id="auth">
  <div class="box" id="auth-box"></div>
</div>

<!-- ═══ APP SHELL ═══ -->
<div id="app" class="hidden">
  <nav id="rail" aria-label="Primary">
    <div class="brand">Home<br>Base<small>v2</small></div>
    <button class="nav-btn" data-nav="today" title="Today (1)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Today</button>
    <button class="nav-btn" data-nav="tasks" title="Tasks (2)"><svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>Tasks</button>
    <button class="nav-btn" data-nav="home" title="Home (3)"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>Home</button>
    <button class="nav-btn" data-nav="projects" title="Projects (4)"><svg viewBox="0 0 24 24"><path d="M3 7h6l2 2h10v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M3 7V5a1 1 0 0 1 1-1h4"/></svg>Projects</button>
    <button class="nav-btn" data-nav="calendar" title="Calendar (5)"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>Calendar</button>
    <div class="spacer"></div>
    <button class="nav-btn" data-nav="settings" title="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</button>
  </nav>

  <div id="main">
    <header id="topbar">
      <button class="icon-btn hidden" id="back-btn" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <h1 id="title">Today</h1>
      <span class="sub" id="subtitle"></span>
      <div class="topbar-actions">
        <button class="pill" id="sync-pill" title="Sync status"><span class="dot" id="sync-dot"></span><span id="sync-lbl">Local</span></button>
        <button class="icon-btn" id="wall-btn" title="Wall display"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 21h8M12 18v3"/></svg></button>
        <button class="icon-btn" id="ai-btn" title="Ask HomeBase (/)"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 15l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/></svg></button>
      </div>
    </header>

    <div id="view">
      <section class="pane" id="pane-today"><div class="pane-body scroll" id="today-body"></div></section>
      <section class="pane" id="pane-tasks"><div class="tasks-layout" id="tasks-layout"></div></section>
      <section class="pane" id="pane-home"><div class="pane-body scroll" id="home-body"></div></section>
      <section class="pane" id="pane-projects"><div class="proj-layout" id="proj-layout"></div></section>
      <section class="pane" id="pane-calendar"><div id="cal-root" style="display:flex;flex-direction:column;height:100%;min-height:0"></div></section>
      <section class="pane" id="pane-settings"><div class="pane-body scroll" id="settings-body"></div></section>
    </div>

    <div id="askbar">
      <form class="ask" id="ask-form" autocomplete="off">
        <input id="ask-input" placeholder="Ask HomeBase… “I changed the AC filter”, “what's today?”" aria-label="Ask HomeBase">
        <button type="button" class="ask-btn" id="mic-btn" title="Voice"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
        <button type="submit" class="ask-btn send" id="ask-send" title="Send"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </form>
    </div>

    <nav id="bottom-nav" aria-label="Primary">
      <button class="nav-btn" data-nav="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Today</button>
      <button class="nav-btn" data-nav="tasks"><svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>Tasks</button>
      <button class="nav-btn" data-nav="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>Home</button>
      <button class="nav-btn" data-nav="projects"><svg viewBox="0 0 24 24"><path d="M3 7h6l2 2h10v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M3 7V5a1 1 0 0 1 1-1h4"/></svg>Projects</button>
      <button class="nav-btn" data-nav="calendar"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>Calendar</button>
    </nav>
  </div>
</div>

<!-- ═══ AI PANEL ═══ -->
<div id="ai" aria-hidden="true">
  <div class="scrim" id="ai-scrim"></div>
  <div class="panel" role="dialog" aria-label="Ask HomeBase">
    <div class="hd">
      <h3>✨ HomeBase</h3>
      <button class="btn btn-quiet btn-sm" id="ai-new">New chat</button>
      <button class="icon-btn" id="ai-close" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>
    <div id="ai-msgs" class="scroll"></div>
    <div class="inp">
      <textarea id="ai-input" rows="1" placeholder="Tell me what happened, or ask anything…"></textarea>
      <button class="ask-btn send" id="ai-send"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </div>
  </div>
</div>

<!-- ═══ WALL ═══ -->
<div id="wall">
  <div class="wall-top">
    <div><div class="wall-time" id="wall-time">--:--</div><div class="wall-date" id="wall-date"></div></div>
    <div style="display:flex;gap:12px;align-items:flex-start">
      <div class="wall-wx" id="wall-wx"></div>
      <div class="seg"><button class="active" data-wall="day">Day</button><button data-wall="week">Week</button></div>
      <button class="btn btn-ghost" id="wall-exit">Exit</button>
    </div>
  </div>
  <div class="wall-grid" id="wall-day"></div>
  <div class="wall-week hidden" id="wall-week"></div>
  <div class="wall-reply" id="wall-reply"></div>
  <form class="wall-ask" id="wall-ask" autocomplete="off">
    <input id="wall-input" placeholder="Ask HomeBase…">
    <button type="button" class="ask-btn" id="wall-mic"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <button type="submit" class="ask-btn send"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  </form>
</div>
<div id="pin"><h1 style="color:var(--accent)">HomeBase</h1><div class="muted">Enter PIN</div><div class="dots"><i></i><i></i><i></i><i></i></div><div class="keys" id="pin-keys"></div><div class="coral" id="pin-err" style="color:var(--coral);min-height:20px;font-weight:600"></div></div>

<!-- ═══ GENERIC SHEET ═══ -->
<div class="sheet" id="sheet" aria-hidden="true">
  <div class="panel" role="dialog">
    <div class="handle"></div>
    <div class="hd"><button class="btn btn-quiet" id="sheet-left">Cancel</button><h3 id="sheet-title"></h3><button class="btn btn-quiet" id="sheet-right" style="color:var(--accent)">Save</button></div>
    <div class="bd scroll" id="sheet-body"></div>
    <div class="ft hidden" id="sheet-foot"></div>
  </div>
</div>
<div class="sheet" id="picker" aria-hidden="true" style="z-index:700">
  <div class="panel" role="dialog" style="max-width:440px">
    <div class="handle"></div>
    <div class="hd"><span style="min-width:64px"></span><h3 id="picker-title"></h3><button class="btn btn-quiet" id="picker-done" style="color:var(--accent)">Done</button></div>
    <div class="bd scroll" id="picker-body" style="padding:8px"></div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>
