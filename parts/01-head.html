<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HomeBase">
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1018" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<title>HomeBase</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap">
<script src="config.js" onerror="void 0"></script>
<style>
/* ═══════════════════════════════════════════════════════════════
   TOKENS
   ═══════════════════════════════════════════════════════════════ */
:root{
  --font-ui:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --font-display:'Fraunces',Georgia,'Times New Roman',serif;
  --bg:#f4f3ee;--bg2:#ffffff;--bg3:#f0efe9;--bg4:#e8e6df;
  --border:#e4e2da;--border2:#d3d0c6;
  --text:#1b1e28;--text2:#5d6275;--text3:#8a8fa3;
  --accent:#0f9d8a;--accent-d:#0b8474;--accent-bg:rgba(15,157,138,.10);--accent-ink:#ffffff;
  --amber:#c47f00;--amber-bg:rgba(196,127,0,.12);
  --coral:#d64545;--coral-bg:rgba(214,69,69,.10);
  --violet:#6d5bd0;--violet-bg:rgba(109,91,208,.10);
  --sage:#4f9a5e;--sage-bg:rgba(79,154,94,.12);
  --sky:#3a7dc9;--sky-bg:rgba(58,125,201,.12);
  --r:14px;--rs:10px;--rl:20px;
  --sh:0 10px 30px rgba(20,22,30,.10);--sh2:0 2px 8px rgba(20,22,30,.06);
  --rail:76px;--bottom-nav:64px;--ask-h:56px;
  --ease:cubic-bezier(.32,1.1,.6,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1018;--bg2:#161922;--bg3:#1e222e;--bg4:#252a38;
    --border:#272d3d;--border2:#353c52;
    --text:#dde1f0;--text2:#9aa1b8;--text3:#6a7189;
    --accent:#3ecfb8;--accent-d:#2db8a3;--accent-bg:rgba(62,207,184,.12);--accent-ink:#052a25;
    --amber:#f0a500;--amber-bg:rgba(240,165,0,.12);
    --coral:#ff6b6b;--coral-bg:rgba(255,107,107,.12);
    --violet:#9d7ff4;--violet-bg:rgba(157,127,244,.12);
    --sage:#6db87a;--sage-bg:rgba(109,184,122,.12);
    --sky:#5b9bd5;--sky-bg:rgba(91,155,213,.12);
    --sh:0 10px 34px rgba(0,0,0,.5);--sh2:0 2px 8px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#0e1018;--bg2:#161922;--bg3:#1e222e;--bg4:#252a38;
  --border:#272d3d;--border2:#353c52;
  --text:#dde1f0;--text2:#9aa1b8;--text3:#6a7189;
  --accent:#3ecfb8;--accent-d:#2db8a3;--accent-bg:rgba(62,207,184,.12);--accent-ink:#052a25;
  --amber:#f0a500;--amber-bg:rgba(240,165,0,.12);
  --coral:#ff6b6b;--coral-bg:rgba(255,107,107,.12);
  --violet:#9d7ff4;--violet-bg:rgba(157,127,244,.12);
  --sage:#6db87a;--sage-bg:rgba(109,184,122,.12);
  --sky:#5b9bd5;--sky-bg:rgba(91,155,213,.12);
  --sh:0 10px 34px rgba(0,0,0,.5);--sh2:0 2px 8px rgba(0,0,0,.3);
}

/* ═══════════════════════════════════════════════════════════════
   BASE
   ═══════════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;height:100%}
body{font-family:var(--font-ui);background:var(--bg);color:var(--text);height:100dvh;overflow:hidden;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;-webkit-tap-highlight-color:transparent}
a{color:var(--sky)}
::selection{background:var(--accent-bg)}
h1,h2,h3,.display{font-family:var(--font-display);font-weight:600;letter-spacing:-.01em}
.muted{color:var(--text2)}.faint{color:var(--text3)}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion: reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}

/* scrollbars */
.scroll{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:var(--border2) transparent}
.scroll::-webkit-scrollbar{width:6px}.scroll::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* ═══════════════════════════════════════════════════════════════
   APP SHELL
   ═══════════════════════════════════════════════════════════════ */
#app{display:grid;grid-template-columns:var(--rail) 1fr;grid-template-rows:1fr;height:100dvh;padding-top:env(safe-area-inset-top)}
#rail{background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:14px 8px calc(12px + env(safe-area-inset-bottom));gap:4px}
.brand{font-family:var(--font-display);font-weight:600;color:var(--accent);font-size:15px;margin-bottom:14px;letter-spacing:-.02em;text-align:center;line-height:1.1}
.brand small{display:block;font-family:var(--font-ui);font-weight:600;font-size:9px;letter-spacing:.14em;color:var(--text3);margin-top:3px}
.nav-btn{width:60px;height:56px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--text2);font-size:10.5px;font-weight:600;transition:background .15s,color .15s}
.nav-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav-btn:hover{background:var(--bg3);color:var(--text)}
.nav-btn.active{background:var(--accent-bg);color:var(--accent)}
.nav-btn .badge{position:absolute;top:6px;right:8px;min-width:16px;height:16px;border-radius:8px;background:var(--coral);color:#fff;font-size:9.5px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.nav-btn{position:relative}
#rail .spacer{flex:1}
#main{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
#topbar{height:56px;display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid var(--border);background:var(--bg2);flex-shrink:0}
#topbar h1{font-size:20px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topbar .sub{font-size:13px;color:var(--text3);font-weight:500}
.topbar-actions{display:flex;gap:8px;align-items:center}
#view{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.pane{position:absolute;inset:0;display:none;flex-direction:column;min-height:0}
.pane.active{display:flex}
.pane-body{flex:1;min-height:0;padding:20px 24px 120px}
.container{max-width:1080px;margin:0 auto;width:100%}
.two-col{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:start}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;align-items:start}

/* sync pill / clock */
.pill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:15px;border:1px solid var(--border);background:var(--bg3);font-size:12px;font-weight:600;color:var(--text2)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--text3)}
.pill .dot.ok{background:var(--sage);box-shadow:0 0 6px var(--sage)}
.pill .dot.syn{background:var(--amber);animation:pulse 1s infinite}
.pill .dot.err{background:var(--coral)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ═══════════════════════════════════════════════════════════════
   BOTTOM NAV + ASK BAR (phone) / ASK BAR (tablet+desktop)
   ═══════════════════════════════════════════════════════════════ */
#bottom-nav{display:none}
#askbar{position:absolute;left:0;right:0;bottom:0;padding:10px 20px calc(12px + env(safe-area-inset-bottom));pointer-events:none;z-index:40}
#askbar .ask{pointer-events:auto;max-width:720px;margin:0 auto;display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--border2);border-radius:28px;padding:6px 6px 6px 16px;box-shadow:var(--sh)}
#askbar .ask:focus-within{border-color:var(--accent)}
#askbar input{flex:1;border:none;outline:none;background:transparent;font-size:16px;min-width:0}
#askbar input::placeholder{color:var(--text3)}
.ask-btn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text2);flex-shrink:0;transition:background .15s}
.ask-btn:hover{background:var(--bg3)}
.ask-btn.send{background:var(--accent);color:var(--accent-ink)}
.ask-btn.send:disabled{opacity:.4}
.ask-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ask-btn.listening{background:var(--coral-bg);color:var(--coral);animation:pulse 1.2s infinite}

/* ═══════════════════════════════════════════════════════════════
   CARDS / LISTS / ROWS
   ═══════════════════════════════════════════════════════════════ */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh2)}
.card-hd{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px;gap:10px}
.card-hd h3{font-size:16px}
.card-hd .cnt{font-size:12px;color:var(--text3);font-weight:600}
.card-bd{padding:4px 8px 8px}
.sec-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--text3);padding:18px 4px 8px;display:flex;align-items:center;justify-content:space-between}
.sec-title:first-child{padding-top:4px}
.sec-title .link{font-size:12px;text-transform:none;letter-spacing:0;font-weight:600;color:var(--accent)}

.row{display:flex;align-items:center;gap:12px;padding:11px 10px;border-radius:12px;cursor:pointer;position:relative;transition:background .12s;min-height:52px}
.row:hover{background:var(--bg3)}
.row:active{background:var(--bg4)}
.row + .row::before{content:'';position:absolute;top:0;left:54px;right:10px;height:1px;background:var(--border)}
.row.no-line + .row::before,.row.no-line::before{display:none}
.row .ico{width:34px;height:34px;border-radius:10px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.row .body{flex:1;min-width:0}
.row .title{font-weight:500;font-size:15px;line-height:1.3}
.row .ctx{font-size:12.5px;color:var(--text3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ctx b{color:var(--text2);font-weight:600}
.row .right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.row.done .title{text-decoration:line-through;color:var(--text3)}
.row.done{opacity:.6}
.chev{width:16px;height:16px;stroke:var(--text3);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--border2);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;color:var(--accent-ink)}
.check svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.6);transition:all .15s}
.check:hover{border-color:var(--accent)}
.check.on{background:var(--accent);border-color:var(--accent)}
.check.on svg{opacity:1;transform:scale(1)}
.check.must{border-color:var(--coral)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--bg3);color:var(--text2);white-space:nowrap}
.tag.must{background:var(--coral-bg);color:var(--coral)}
.tag.should{background:var(--amber-bg);color:var(--amber)}
.tag.nice{background:var(--bg3);color:var(--text3)}
.tag.accent{background:var(--accent-bg);color:var(--accent)}
.tag.violet{background:var(--violet-bg);color:var(--violet)}
.tag.sage{background:var(--sage-bg);color:var(--sage)}
.tag.sky{background:var(--sky-bg);color:var(--sky)}
.tag.coral{background:var(--coral-bg);color:var(--coral)}
.empty{padding:26px 16px;text-align:center;color:var(--text3);font-size:14px}
.empty .big{font-size:28px;margin-bottom:6px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 16px;border-radius:var(--rs);font-weight:600;font-size:14px;border:1px solid transparent;transition:all .15s;white-space:nowrap}
.btn:disabled{opacity:.45;cursor:default}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{background:var(--accent-d)}
.btn-ghost{background:var(--bg3);color:var(--text2);border-color:var(--border)}
.btn-ghost:hover{color:var(--text);border-color:var(--border2)}
.btn-quiet{color:var(--text2)}
.btn-quiet:hover{background:var(--bg3);color:var(--text)}
.btn-danger{background:var(--coral-bg);color:var(--coral)}
.btn-sm{height:32px;padding:0 12px;font-size:13px}
.btn-lg{height:48px;font-size:16px;border-radius:14px}
.btn-block{width:100%}
.icon-btn{width:38px;height:38px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--text2)}
.icon-btn:hover{background:var(--bg3);color:var(--text)}
.icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* segmented control */
.seg{display:inline-flex;background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:3px;gap:2px}
.seg button{height:30px;padding:0 12px;border-radius:9px;font-size:13px;font-weight:600;color:var(--text2)}
.seg button.active{background:var(--bg2);color:var(--text);box-shadow:var(--sh2)}

/* progress */
.bar{height:6px;border-radius:3px;background:var(--bg4);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--violet),var(--accent))}
.ring{width:34px;height:34px;flex-shrink:0}
.ring circle{fill:none;stroke-width:3}
.ring .bgc{stroke:var(--bg4)}.ring .fgc{stroke:var(--accent);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dasharray .4s}

/* ═══════════════════════════════════════════════════════════════
   TODAY
   ═══════════════════════════════════════════════════════════════ */
.today-hero{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.today-hero h2{font-size:30px;line-height:1.05}
.today-hero .date{color:var(--text3);font-weight:500;font-size:14px;margin-bottom:6px}
.cap-meter{min-width:220px;flex:0 0 auto}
.cap-meter .lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--text3);font-weight:600;margin-bottom:6px}
.cap-meter .lbl b{color:var(--text2)}
.cap-meter .bar > i{background:var(--accent)}
.cap-meter.over .bar > i{background:var(--coral)}
.mode-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;background:var(--amber-bg);color:var(--amber);cursor:pointer}
.attn{display:flex;align-items:center;gap:12px;padding:10px 10px;border-radius:12px;position:relative}
.attn + .attn::before{content:'';position:absolute;top:0;left:10px;right:10px;height:1px;background:var(--border)}
.attn .rank{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.attn .rank.r1,.attn .rank.r2{background:var(--coral)}.attn .rank.r3{background:var(--amber)}.attn .rank.r4{background:var(--violet)}.attn .rank.r5{background:var(--sage)}
.attn .body{flex:1;min-width:0}
.attn .title{font-weight:600;font-size:14.5px}
.attn .detail{font-size:12.5px;color:var(--text3)}
.attn .acts{display:flex;gap:6px;flex-shrink:0}
.proj-mini{display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:12px;cursor:pointer}
.proj-mini:hover{background:var(--bg3)}
.proj-mini .body{flex:1;min-width:0}
.proj-mini .title{font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px}
.proj-mini .next{font-size:12.5px;color:var(--text3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj-mini .bar{margin-top:8px}
.coming-day{padding:8px 10px 2px;font-size:12px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.08em}
.score-why{font-size:11px;color:var(--text3)}

/* ═══════════════════════════════════════════════════════════════
   TASKS
   ═══════════════════════════════════════════════════════════════ */
.tasks-layout{display:grid;grid-template-columns:260px 1fr;height:100%;min-height:0}
.tasks-side{border-right:1px solid var(--border);background:var(--bg2);display:flex;flex-direction:column;min-height:0}
.tasks-side .scroll{padding:10px}
.side-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer;color:var(--text2);font-weight:500;font-size:14px;min-height:40px}
.side-item:hover{background:var(--bg3);color:var(--text)}
.side-item.active{background:var(--accent-bg);color:var(--accent)}
.side-item .em{width:24px;text-align:center}
.side-item .cnt{margin-left:auto;font-size:11px;color:var(--text3);background:var(--bg3);padding:1px 7px;border-radius:9px}
.side-item.active .cnt{background:var(--bg2)}
.tasks-main{display:flex;flex-direction:column;min-height:0}
.list-hd{display:flex;align-items:center;gap:10px;padding:14px 20px 10px;flex-shrink:0;flex-wrap:wrap}
.list-hd h2{font-size:20px;flex:1}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:30px;padding:0 12px;border-radius:15px;border:1px solid var(--border);background:var(--bg2);font-size:13px;font-weight:600;color:var(--text2)}
.chip.active{background:var(--accent-bg);color:var(--accent);border-color:transparent}
.swipe{position:relative;overflow:hidden;border-radius:12px}
.swipe .row{background:var(--bg2);border-radius:0;transition:transform .22s var(--ease);will-change:transform}
.swipe .under{opacity:0;transition:opacity .15s}
.swipe[data-open="1"] .under,.swipe.dragging .under{opacity:1}
.swipe .under{position:absolute;inset:0 0 0 auto;width:150px;display:flex}
.swipe .under button{flex:1;color:#fff;font-weight:700;font-size:13px}
.swipe .under .snooze{background:var(--amber)}.swipe .under .del{background:var(--coral)}

/* ═══════════════════════════════════════════════════════════════
   PROJECTS
   ═══════════════════════════════════════════════════════════════ */
.proj-layout{display:grid;grid-template-columns:300px 1fr;height:100%;min-height:0}
.proj-side{border-right:1px solid var(--border);background:var(--bg2);display:flex;flex-direction:column;min-height:0}
.proj-item{padding:12px 12px;border-radius:12px;cursor:pointer;border:1px solid transparent;margin-bottom:6px}
.proj-item:hover{background:var(--bg3)}
.proj-item.active{background:var(--violet-bg);border-color:rgba(109,91,208,.25)}
.proj-item .nm{font-weight:600;font-size:15px;display:flex;justify-content:space-between;gap:8px}
.proj-item .nm .pri{font-size:11px;color:var(--violet);font-weight:800}
.proj-item .st{font-size:12.5px;color:var(--text3);margin:2px 0 8px}
.proj-main{min-height:0;display:flex;flex-direction:column}
.step{display:flex;align-items:flex-start;gap:12px;padding:10px 10px;border-radius:12px;position:relative}
.step + .step::before{content:'';position:absolute;top:0;left:48px;right:10px;height:1px;background:var(--border)}
.step .check{margin-top:1px}
.step .t{font-weight:500;font-size:15px}
.step .m{font-size:12.5px;color:var(--text3);margin-top:2px}
.step.blocked{opacity:.55}
.step.blocked .check{border-style:dashed}
.step.done .t{text-decoration:line-through;color:var(--text3)}
.phase-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--violet);padding:12px 10px 4px}
table.costs{width:100%;border-collapse:collapse;font-size:14px}
table.costs th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);font-weight:700}
table.costs td{padding:10px;border-bottom:1px solid var(--border)}
table.costs tr:last-child td{border-bottom:none}
table.costs .num{text-align:right;font-variant-numeric:tabular-nums}
table.costs tfoot td{font-weight:700;background:var(--bg3)}

/* ═══════════════════════════════════════════════════════════════
   CALENDAR
   ═══════════════════════════════════════════════════════════════ */
.cal-tb{display:flex;align-items:center;gap:8px;padding:12px 20px;flex-shrink:0;flex-wrap:wrap}
.cal-tb h2{font-size:18px;min-width:200px}
.cal-month{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 20px 20px}
.cal-dn{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.cal-dn div{text-align:center;font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.08em}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;gap:6px;flex:1;min-height:0}
.cal-cell{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:3px;overflow:hidden;cursor:pointer;min-height:84px}
.cal-cell:hover{border-color:var(--border2)}
.cal-cell.other{opacity:.4}
.cal-cell.today{border-color:var(--accent);background:var(--accent-bg)}
.cal-cell .n{font-size:12px;font-weight:700;color:var(--text2)}
.cal-cell.today .n{color:var(--accent)}
.cal-cell .mode{font-size:10px;font-weight:700;color:var(--amber);text-transform:uppercase}
.cev{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--sky-bg);color:var(--sky)}
.cev.task{background:var(--accent-bg);color:var(--accent)}
.cev.must{background:var(--coral-bg);color:var(--coral)}
.cev.block{background:var(--violet-bg);color:var(--violet)}
.cev.maint{background:var(--amber-bg);color:var(--amber)}
.cev.more{background:transparent;color:var(--text3)}
.cal-week{flex:1;min-height:0;padding:0 20px 20px;display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.cal-day-col{background:var(--bg2);border:1px solid var(--border);border-radius:14px;display:flex;flex-direction:column;min-height:0}
.cal-day-col.today{border-color:var(--accent)}
.cal-day-col .hd{padding:10px 12px;border-bottom:1px solid var(--border);display:flex;align-items:baseline;gap:6px}
.cal-day-col .hd b{font-size:18px}
.cal-day-col .hd span{font-size:11px;text-transform:uppercase;color:var(--text3);font-weight:700}
.cal-day-col .bd{padding:8px;display:flex;flex-direction:column;gap:5px}
.cal-item{display:flex;gap:8px;align-items:flex-start;padding:7px 8px;border-radius:8px;font-size:13px;cursor:pointer}
.cal-item:hover{background:var(--bg3)}
.cal-item .tm{font-size:11px;font-weight:700;color:var(--sky);min-width:46px;padding-top:1px}
.cal-item .dt{width:8px;height:8px;border-radius:50%;margin:5px 0 0 0;flex-shrink:0}
.cal-item .nm{flex:1;min-width:0}
.cal-item .sub{font-size:11.5px;color:var(--text3)}
.cal-list{padding:0 20px 20px}
.cal-list .dayhd{display:flex;align-items:center;gap:10px;padding:14px 4px 6px}
.cal-list .dayhd b{width:32px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:15px}
.cal-list .dayhd.today b{background:var(--accent);color:var(--accent-ink)}
.cal-list .dayhd span{font-size:12px;font-weight:700;text-transform:uppercase;color:var(--text3);letter-spacing:.08em}

/* ═══════════════════════════════════════════════════════════════
   HOME
   ═══════════════════════════════════════════════════════════════ */
.home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;align-items:start}
.status-dot{width:9px;height:9px;border-radius:50%}
.st-ok{background:var(--sage)}.st-soon{background:var(--amber)}.st-over{background:var(--coral)}

/* ═══════════════════════════════════════════════════════════════
   SETTINGS / KNOWS
   ═══════════════════════════════════════════════════════════════ */
.settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;align-items:start}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;height:42px;padding:0 12px;border-radius:var(--rs);border:1px solid var(--border2);background:var(--bg3);outline:none;font-size:16px}
.field textarea{height:auto;min-height:80px;padding:10px 12px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.field .help{font-size:12px;color:var(--text3);margin-top:4px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mem{display:flex;gap:12px;padding:12px 10px;position:relative;align-items:flex-start}
.mem + .mem::before{content:'';position:absolute;top:0;left:10px;right:10px;height:1px;background:var(--border)}
.mem .body{flex:1;min-width:0}
.mem .content{font-size:14.5px}
.mem .meta{font-size:12px;color:var(--text3);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.mem .acts{display:flex;gap:4px;flex-shrink:0}
.mem.ignored{opacity:.5}
.conf{font-size:11px;font-weight:700;padding:1px 7px;border-radius:10px}
.conf.sure{background:var(--sage-bg);color:var(--sage)}.conf.likely{background:var(--amber-bg);color:var(--amber)}.conf.guess{background:var(--bg3);color:var(--text3)}
.person-chip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:20px;background:var(--bg3);border:1px solid var(--border);font-weight:600;font-size:14px}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.avatar.violet{background:var(--violet);color:#fff}
code.kbd{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:1px 6px}

/* ═══════════════════════════════════════════════════════════════
   SHEETS / MODALS / TOAST
   ═══════════════════════════════════════════════════════════════ */
.sheet{position:fixed;inset:0;z-index:600;display:flex;align-items:flex-end;justify-content:center;background:rgba(10,12,20,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .2s}
.sheet.open{opacity:1;pointer-events:auto}
.sheet .panel{background:var(--bg2);width:100%;max-width:560px;max-height:92dvh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;transform:translateY(40px);transition:transform .28s var(--ease);padding-bottom:env(safe-area-inset-bottom);box-shadow:var(--sh);border:1px solid var(--border)}
.sheet.open .panel{transform:translateY(0)}
.sheet .handle{width:36px;height:4px;border-radius:2px;background:var(--border2);margin:10px auto 0}
.sheet .hd{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 10px;border-bottom:1px solid var(--border);gap:8px}
.sheet .hd h3{font-size:18px;flex:1;text-align:center}
.sheet .hd .btn-quiet{min-width:64px}
.sheet .bd{padding:16px;overflow-y:auto;overscroll-behavior:contain}
.sheet .ft{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px}
.sheet .ft .btn{flex:1}
.rows{background:var(--bg3);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-top:12px}
.srow{display:flex;align-items:center;gap:12px;min-height:50px;padding:0 14px;cursor:pointer;position:relative}
.srow + .srow{border-top:1px solid var(--border)}
.srow .ic{width:24px;text-align:center;font-size:16px}
.srow .lb{flex:1;font-weight:600;color:var(--text2);font-size:14px}
.srow .vl{color:var(--text);font-size:14px;max-width:55%;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow input[type=date],.srow input[type=time],.srow input[type=number],.srow select{background:transparent;border:none;outline:none;color:var(--accent);font-weight:600;font-size:15px;text-align:right;min-width:0}
.srow select{appearance:none;-webkit-appearance:none;padding-right:2px}
.big-input{width:100%;font-size:18px;padding:12px 14px;border:1.5px solid var(--border2);border-radius:14px;background:var(--bg3);outline:none}
.big-input:focus{border-color:var(--accent)}
textarea.big-input{font-size:15px;min-height:64px;resize:none}
.seg-imp{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:12px}
.seg-imp button{height:44px;border-radius:12px;border:1.5px solid var(--border);font-weight:700;font-size:13px;color:var(--text2);background:var(--bg3)}
.seg-imp button.must.active{border-color:var(--coral);color:var(--coral);background:var(--coral-bg)}
.seg-imp button.should.active{border-color:var(--amber);color:var(--amber);background:var(--amber-bg)}
.seg-imp button.nice.active{border-color:var(--text3);color:var(--text);background:var(--bg4)}
.toggle{position:relative;width:46px;height:28px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.toggle i{position:absolute;inset:0;border-radius:14px;background:var(--border2);transition:background .2s;cursor:pointer}
.toggle i::before{content:'';position:absolute;width:22px;height:22px;left:3px;top:3px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.toggle input:checked + i{background:var(--accent)}
.toggle input:checked + i::before{transform:translateX(18px)}
.picker-item{display:flex;align-items:center;gap:12px;padding:13px 16px;cursor:pointer;border-radius:10px}
.picker-item:hover{background:var(--bg3)}
.picker-item .check{width:22px;height:22px}
.picker-item.sel{color:var(--accent)}
#toast{position:fixed;left:50%;bottom:calc(var(--ask-h) + 40px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:600;opacity:0;transition:all .22s;z-index:900;box-shadow:var(--sh);pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast button{pointer-events:auto;margin-left:10px;color:var(--accent);font-weight:700}

/* ═══════════════════════════════════════════════════════════════
   AI PANEL
   ═══════════════════════════════════════════════════════════════ */
#ai{position:fixed;inset:0;z-index:500;display:flex;justify-content:flex-end;pointer-events:none}
#ai .scrim{position:absolute;inset:0;background:rgba(10,12,20,.35);opacity:0;transition:opacity .2s}
#ai .panel{position:relative;width:min(520px,100%);height:100%;background:var(--bg2);border-left:1px solid var(--border);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .28s var(--ease);box-shadow:var(--sh);padding-top:env(safe-area-inset-top)}
#ai.open{pointer-events:auto}
#ai.open .scrim{opacity:1}
#ai.open .panel{transform:translateX(0)}
#ai .hd{height:56px;display:flex;align-items:center;gap:8px;padding:0 12px 0 18px;border-bottom:1px solid var(--border)}
#ai .hd h3{flex:1;font-size:17px;color:var(--violet)}
#ai-msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;overscroll-behavior:contain}
.msg{display:flex;gap:10px;align-items:flex-start;max-width:100%}
.msg.user{flex-direction:row-reverse}
.msg .bub{padding:10px 14px;border-radius:16px;font-size:14.5px;line-height:1.5;max-width:88%;word-wrap:break-word}
.msg.ai .bub{background:var(--bg3);border-top-left-radius:4px}
.msg.user .bub{background:var(--accent);color:var(--accent-ink);border-top-right-radius:4px}
.msg .bub p + p{margin-top:8px}
.msg .bub ul{padding-left:18px;margin:6px 0}
.msg .bub strong{font-weight:700}
.msg .bub ol{padding-left:20px;margin:6px 0}
.msg .bub li{margin:2px 0}
.msg .bub h3,.msg .bub h4{margin:10px 0 4px;font-size:14.5px;font-weight:700;letter-spacing:0}
.msg .bub h3:first-child,.msg .bub h4:first-child{margin-top:0}
.msg .bub code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:var(--bg4,rgba(127,127,127,.15));padding:1px 5px;border-radius:5px}
.msg .bub pre{background:var(--bg4,rgba(127,127,127,.15));padding:8px 10px;border-radius:10px;overflow:auto;margin:6px 0}
.msg .bub pre code{background:none;padding:0}
.msg .bub a{color:var(--violet);text-decoration:underline;text-underline-offset:2px}
.msg.user .bub a{color:inherit}
.msg .bub .tbl{overflow-x:auto;margin:8px -4px}
.msg .bub table{border-collapse:collapse;font-size:13px;min-width:100%}
.msg .bub th,.msg .bub td{border:1px solid var(--border2);padding:5px 8px;text-align:left;vertical-align:top}
.msg .bub th{background:var(--bg2);font-weight:600}
.msg .bub hr{border:0;border-top:1px solid var(--border2);margin:10px 0}
.msg .sources{font-size:12px;color:var(--text3);margin:4px 0 0 4px;max-width:88%}
.msg .sources a{color:var(--text3);text-decoration:none;border-bottom:1px dotted var(--border2)}
.msg .sources span{margin-right:8px;white-space:nowrap}
.msg .bub .att-chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 6px}
.att-chip{display:inline-flex;align-items:center;gap:6px;max-width:220px;padding:4px 8px 4px 4px;border-radius:10px;background:rgba(0,0,0,.08);font-size:12px;font-weight:600}
.msg.ai .att-chip{background:var(--bg2)}
.att-chip img,.att-chip .ico{width:28px;height:28px;border-radius:6px;object-fit:cover;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.att-chip .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person-pill{gap:5px;padding-left:8px}
.person-pill .chev{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;margin-left:-2px}
.popmenu{position:fixed;z-index:120;min-width:200px;background:var(--bg2);border:1px solid var(--border2);border-radius:14px;box-shadow:var(--sh);padding:6px;display:flex;flex-direction:column;gap:2px}
.popmenu[hidden]{display:none}
.popmenu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border-radius:10px;font-size:14.5px;font-weight:500;color:var(--text)}
.popmenu button:hover,.popmenu button:focus-visible{background:var(--bg3)}
.popmenu button.on{background:var(--accent-bg,rgba(0,0,0,.06));font-weight:700}
.popmenu .hint{font-size:11.5px;color:var(--text3);padding:6px 12px 6px}
.popmenu .sep{height:1px;background:var(--border);margin:4px 8px}
.popmenu .seg{margin:6px 8px 8px}
.attach-btn{color:var(--text3)}
.attach-btn.has{color:var(--violet)}
#ai .tray{display:flex;gap:8px;padding:8px 12px 0;overflow-x:auto;flex-shrink:0}
#ai .tray[hidden]{display:none}
.tray .att{position:relative;width:74px;flex-shrink:0;border:1px solid var(--border2);border-radius:12px;background:var(--bg3);padding:4px;font-size:10.5px;color:var(--text2)}
.tray .att .th{width:64px;height:54px;border-radius:8px;object-fit:cover;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:22px}
.tray .att .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:3px}
.tray .att .st{color:var(--text3)}
.tray .att.err{border-color:var(--coral)}
.tray .att.err .st{color:var(--coral)}
.tray .att .x{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--text);color:var(--bg2);font-size:12px;line-height:20px;text-align:center;border:2px solid var(--bg2)}
.tray .att .bar{position:absolute;left:6px;right:6px;bottom:3px;height:3px;border-radius:2px;background:var(--border2);overflow:hidden}
.tray .att .bar i{display:block;height:100%;width:40%;background:var(--violet);animation:slide 1s linear infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
#ai .drop-hint{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(109,91,208,.14);border:2px dashed var(--violet);border-radius:0;font-weight:700;color:var(--violet);pointer-events:none;z-index:5}
#ai .panel.dragover .drop-hint{display:flex}
.files-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;padding:10px 12px 12px}
.files-grid .f{border-radius:12px;overflow:hidden;background:var(--bg3);border:1px solid var(--border);cursor:pointer;font-size:11px;color:var(--text2)}
.files-grid .f .th{height:80px;width:100%;object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:26px;background:var(--bg2)}
.files-grid .f .nm{padding:4px 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scope-seg{display:flex;gap:4px;background:var(--bg3);border-radius:10px;padding:3px}
.scope-seg button{padding:5px 10px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--text2)}
.scope-seg button.on{background:var(--bg2);color:var(--text);box-shadow:var(--sh2)}
.tool-line{font-size:12px;color:var(--text3);display:flex;align-items:center;gap:6px;padding:2px 4px}
.tool-line .sp{width:10px;height:10px;border:2px solid var(--border2);border-top-color:var(--violet);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.action-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:8px 12px;font-size:13px;display:flex;align-items:center;gap:8px;max-width:88%}
.action-card .ok{color:var(--sage);font-weight:800}
.action-card button{margin-left:auto;color:var(--accent);font-weight:700;font-size:12px}
.proposal{background:var(--amber-bg);border:1px solid rgba(196,127,0,.3);border-radius:12px;padding:10px 12px;font-size:13.5px;max-width:88%}
.proposal .acts{display:flex;gap:8px;margin-top:8px}
#ai .inp{display:flex;gap:8px;align-items:flex-end;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--border)}
#ai textarea{flex:1;border:1.5px solid var(--border2);border-radius:20px;background:var(--bg3);padding:10px 14px;font-size:16px;resize:none;max-height:130px;outline:none;line-height:1.4}
#ai textarea:focus{border-color:var(--violet)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0}
.chips button{height:30px;padding:0 12px;border-radius:15px;border:1px solid var(--border2);font-size:12.5px;font-weight:600;color:var(--text2)}
.chips button:hover{border-color:var(--violet);color:var(--violet)}
.cursor::after{content:'▍';color:var(--violet);animation:pulse 1s infinite}

/* ═══════════════════════════════════════════════════════════════
   AUTH / SETUP / WALL
   ═══════════════════════════════════════════════════════════════ */
#auth{position:fixed;inset:0;z-index:1000;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
#auth .box{width:100%;max-width:400px;background:var(--bg2);border:1px solid var(--border);border-radius:22px;padding:28px;box-shadow:var(--sh)}
#auth h1{font-size:28px;color:var(--accent);margin-bottom:4px}
#auth .sub{color:var(--text3);font-size:14px;margin-bottom:22px}
#auth .alt{text-align:center;font-size:13px;color:var(--text3);margin-top:14px}
#auth .alt button{color:var(--accent);font-weight:700}
.note{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--text2);line-height:1.5}

#wall{position:fixed;inset:0;z-index:800;background:var(--bg);display:none;flex-direction:column;padding:28px 32px calc(20px + env(safe-area-inset-bottom));gap:18px}
#wall.open{display:flex}
#wall.dim{filter:brightness(.55)}
.wall-top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}
.wall-time{font-family:var(--font-display);font-size:64px;line-height:1;letter-spacing:-.02em}
.wall-date{font-size:18px;color:var(--text2);margin-top:6px;font-weight:500}
.wall-wx{text-align:right;font-size:16px;color:var(--text2)}
.wall-wx b{display:block;font-size:26px;color:var(--text)}
.wall-grid{flex:1;min-height:0;display:grid;grid-template-columns:1.2fr 1fr 1fr;grid-template-rows:1fr 1fr;gap:16px}

.wall-week .d.today{border-color:var(--accent)}
.wall-week .d .h{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3)}
.wall-week .d .h b{display:block;font-size:26px;color:var(--text);letter-spacing:0}
.wall-week .d .it{font-size:15px;line-height:1.3;padding:5px 0;border-top:1px solid var(--border)}
.wall-week .d .it small{display:block;color:var(--text3);font-size:12px}
.wall-reply{position:absolute;left:32px;right:32px;bottom:110px;background:var(--bg2);border:1px solid var(--border2);border-radius:20px;padding:18px 22px;font-size:20px;line-height:1.45;box-shadow:var(--sh);display:none;max-height:40vh;overflow:auto}
.wall-reply.show{display:block}

#pin.open{display:flex}
#pin .dots{display:flex;gap:16px}
#pin .dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--border2)}
#pin .dots i.on{background:var(--accent);border-color:var(--accent)}
#pin .keys{display:grid;grid-template-columns:repeat(3,84px);gap:12px}
#pin .keys button{height:76px;border-radius:18px;background:var(--bg2);border:1px solid var(--border);font-size:28px;font-weight:600}
#pin .keys button:active{background:var(--accent-bg)}
