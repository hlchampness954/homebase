name: Import HomeBase v2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import staged HomeBase v2 archive
        shell: bash
        run: |
          set -euo pipefail
          if ! compgen -G ".homebase-import/chunk-*.b64" > /dev/null; then
            echo "No staged import chunks found; nothing to do."
            exit 0
          fi
          cat .homebase-import/chunk-*.b64 | tr -d '\n\r' | base64 -d > /tmp/homebase-v2.zip
          mkdir -p /tmp/homebase-v2
          unzip -q /tmp/homebase-v2.zip -d /tmp/homebase-v2
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name .homebase-import -exec rm -rf {} +
          cp -a /tmp/homebase-v2/. .
          rm -rf .homebase-import
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Import HomeBase v2 Phase 1"
          git push
